name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build --release --target x86_64-pc-windows-msvc
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/dsh-desktop.exe dist/dsh-desktop.exe
          Compress-Archive -Path dist/dsh-desktop.exe -DestinationPath dsh-desktop-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dsh-desktop-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: |
          APP="DSH Desktop.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/aarch64-apple-darwin/release/dsh-desktop "$APP/Contents/MacOS/dsh-desktop"
          chmod +x "$APP/Contents/MacOS/dsh-desktop"
          cp packaging/macos/Info.plist "$APP/Contents/Info.plist"
          tar -czf dsh-desktop-macos-arm64.tar.gz "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dsh-desktop-macos-arm64.tar.gz

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
