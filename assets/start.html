<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DSH Desktop</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #080b12; color: #f7f8fb; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; background: radial-gradient(circle at 20% 0%, #19305e 0, transparent 40%), radial-gradient(circle at 100% 100%, #153d49 0, transparent 42%), #080b12; }
    .shell { width: min(760px, calc(100vw - 48px)); padding: 44px; border: 1px solid #ffffff1a; border-radius: 28px; background: #111723d9; box-shadow: 0 32px 100px #0008, inset 0 1px #ffffff12; backdrop-filter: blur(28px); }
    .brand { display: flex; gap: 14px; align-items: center; margin-bottom: 42px; }
    .mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 15px; color: #04111a; font-weight: 900; background: linear-gradient(135deg, #8af6e0, #63a3ff); box-shadow: 0 8px 28px #63a3ff44; }
    .eyebrow { color: #8af6e0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 4px 0 0; font-size: 28px; letter-spacing: -.03em; }
    .hero { max-width: 620px; }
    .hero h2 { margin: 0 0 12px; font-size: 38px; line-height: 1.08; letter-spacing: -.04em; }
    .hero p { margin: 0 0 28px; color: #aab5c8; line-height: 1.65; }
    label { display: block; margin: 0 0 9px; color: #d8e0ee; font-size: 13px; font-weight: 650; }
    input { width: 100%; padding: 15px 16px; border: 1px solid #ffffff1f; border-radius: 13px; outline: none; color: #fff; background: #060912aa; font: inherit; }
    input:focus { border-color: #8af6e0; box-shadow: 0 0 0 4px #8af6e01c; }
    .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; }
    button { border: 0; border-radius: 12px; padding: 13px 18px; color: #071116; background: #8af6e0; font: inherit; font-weight: 750; cursor: pointer; }
    button.secondary { color: #dce5f4; background: #ffffff12; }
    button:hover { filter: brightness(1.08); }
    .hint { margin-top: 18px; color: #7f8ba0; font-size: 12px; line-height: 1.55; }
    .status { display: none; margin-top: 28px; padding: 15px 16px; border-radius: 13px; background: #ffffff0d; color: #aab5c8; font-size: 13px; line-height: 1.5; }
    .status.visible { display: block; }
    .status strong { display: block; margin-bottom: 4px; color: #f7f8fb; }
    .spinner { display: inline-block; width: 13px; height: 13px; margin-right: 7px; border: 2px solid #ffffff33; border-top-color: #8af6e0; border-radius: 50%; vertical-align: -2px; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    footer { margin-top: 34px; color: #617087; font-size: 11px; }
    footer a { color: #8aa2c2; cursor: pointer; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><div class="mark">D</div><div><div class="eyebrow">DeepSeek-first</div><h1>DSH Desktop</h1></div></header>
    <section class="hero">
      <h2>给一个 Key，开始工作。</h2>
      <p>Rust 原生桌面壳，自动准备 DeepSeek Harness、Web UI 插件和本地工作区。API Key 只通过系统钥匙串保存，不写入项目文件。</p>
      <form id="key-form">
        <label for="api-key">DeepSeek API Key</label>
        <input id="api-key" name="api-key" type="password" autocomplete="off" placeholder="sk-…" spellcheck="false" autofocus>
        <div class="actions"><button type="submit">连接 DeepSeek</button><button class="secondary" type="button" id="docs">获取 API Key</button></div>
      </form>
      <div id="status" class="status"><strong id="status-title"></strong><span id="status-detail"></span></div>
      <div class="hint">Key 只会传给本机 DSH 进程；本应用不上传、不统计、不打印 Key。</div>
    </section>
    <footer>开源项目 · <a id="reset">清除本机 Key</a></footer>
  </main>
  <script>
    const ipc = (payload) => window.ipc && window.ipc.postMessage(JSON.stringify(payload));
    const form = document.querySelector('#key-form');
    const key = document.querySelector('#api-key');
    const status = document.querySelector('#status');
    const title = document.querySelector('#status-title');
    const detail = document.querySelector('#status-detail');
    window.__dshSetStatus = (nextTitle, nextDetail) => { status.classList.add('visible'); title.textContent = nextTitle; detail.innerHTML = `<span class="spinner"></span>${nextDetail}`; };
    form.addEventListener('submit', (event) => { event.preventDefault(); if (key.value.trim()) { window.__dshSetStatus('正在连接…', '准备本机 DeepSeek 工作台'); ipc({ type: 'save_key', key: key.value }); key.value = ''; } });
    document.querySelector('#docs').addEventListener('click', () => ipc({ type: 'open_docs' }));
    document.querySelector('#reset').addEventListener('click', () => ipc({ type: 'reset_key' }));
  </script>
</body>
</html>
