[package]
name = "dsh-desktop"
version = "0.1.5"
edition = "2021"
rust-version = "1.77"
description = "DeepSeek-first desktop shell for DeepSeek Harness"
license = "MIT"
repository = "https://github.com/neko233-com/dsh-desktop"
homepage = "https://github.com/neko233-com/dsh-desktop"
readme = "README.md"

[dependencies]
base64 = "0.22"
directories = "6.0"
keyring = { version = "4.1", default-features = false, features = ["v1", "apple-native-keyring-store", "windows-native-keyring-store"] }
open = "5.3"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
wry = { version = "0.56", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
